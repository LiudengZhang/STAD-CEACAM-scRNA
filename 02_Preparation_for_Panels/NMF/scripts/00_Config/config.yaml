# 3CA Meta-Program Analysis Configuration
# Based on Gavish et al. Nature 2023 methodology

# Paths
paths:
  input_h5ad: "../01_Input_Data/epithelial_with_raw_counts_full.h5ad"
  output_dir: "../03_Output"
  log_dir: "../04_Logs"

# Data filtering
data:
  # Only include stomach samples (primary tumor site)
  filter_tissue: "Stomach"
  # Minimum cells per sample for NMF
  min_cells_per_sample: 100
  # Highly variable genes for NMF input
  n_hvg: 2000

# NMF parameters (per Gavish et al.)
nmf:
  # K values to test (3CA standard: 4-9)
  k_values: [4, 5, 6, 7, 8, 9]
  # Number of iterations for each K (3CA standard: 10)
  n_iter: 10
  # Random seed for reproducibility
  random_seed: 42
  # Top genes to extract per NMF program
  top_genes_per_program: 50
  # NMF method (brunet is standard for scRNA-seq)
  method: "brunet"

# Robust program filtering thresholds (Gavish et al. criteria)
robust_filtering:
  # Within-sample recurrence: minimum gene overlap across K values
  within_sample_threshold: 35  # out of 50 genes
  # Cross-sample recurrence: minimum gene overlap with other samples
  cross_sample_threshold: 10  # out of 50 genes
  # Redundancy removal: maximum overlap allowed between selected programs
  redundancy_threshold: 0.20  # 20% = 10/50 genes

# Meta-program clustering parameters
clustering:
  # Minimum Jaccard similarity to cluster programs together
  jaccard_threshold: 0.10
  # Minimum programs required to form a meta-program
  min_programs_per_mp: 3
  # Clustering method for dendrogram
  linkage_method: "average"

# Activity scoring
scoring:
  # Method for scoring meta-program activity
  method: "scanpy"  # scanpy.tl.score_genes
  # Control gene set size
  ctrl_size: 50
  # Number of bins for score_genes
  n_bins: 25

# Sample grouping for clinical comparisons
sample_groups:
  # Pre-treatment responders (n=4)
  pre_responders:
    - "P03-P1"
    - "P04-P1"
    - "P21-P1"
    - "P22-P1"
  # Pre-treatment non-responders (n=4)
  pre_non_responders:
    - "P01-P1"
    - "P02-P1"
    - "P25-P1"
    - "P26-P1"
  # Post-treatment responders (n=5)
  post_responders:
    - "P05-P2"
    - "P10-P2"
    - "P11-P2"
    - "P12-P2"
    - "P13-P2"
  # Post-treatment non-responders (n=6)
  post_non_responders:
    - "P01-P2"
    - "P06-P2"
    - "P14-P2"
    - "P23-P2"
    - "P24-P2"
    - "P34-P2"

# Statistical testing
statistics:
  # Test method for group comparisons
  method: "mannwhitneyu"
  # Alternative hypothesis
  alternative: "two-sided"
  # Significance threshold
  alpha: 0.05

# Visualization settings
visualization:
  # Figure size (width, height) in inches
  figsize: [10, 8]
  # DPI for output figures
  dpi: 300
  # Color palette for meta-programs
  cmap: "RdBu_r"
  # Output format
  format: "png"

# Pathway enrichment
enrichment:
  # Gene set libraries to query
  gene_sets:
    - "GO_Biological_Process_2023"
    - "KEGG_2021_Human"
    - "Reactome_2022"
    - "MSigDB_Hallmark_2020"
  # Maximum number of pathways to show per meta-program
  top_n_pathways: 10
  # Adjusted p-value cutoff
  padj_cutoff: 0.05
