# Paths below refer to the upstream Round_4 processing pipeline, which is
# not part of this release. This script is included as a record of how the
# input was produced; it is not called by _run_all_panels.sh.
# ============================================================================
# B_cells MAST Analysis Configuration - Post-Treatment
# ============================================================================

data:
  adata_path: "/path/to/Project_4_05232025/Round_4/98_Round_4.2_Standardized_Pipeline/01_For_Annotation/02_Results/level_1/B_cells/01_Data/B_cells_standardized_annotated.h5ad"
  output_dir: "/path/to/Project_4_05232025/Round_4/98_Round_4.2_Standardized_Pipeline/04_MAST_and_DEG/01_Level_1_Major_Cell_Types/B_cells/03_Results"
  cell_type_name: "B_cells"
  single_cell_type_mode: true

analysis:
  cell_type_level: "major"
  methods:
    - "mast"
  comparisons:
    - "03_stomach_post_response"
  mast_parameters:
    max_cells_mast: 15000
    min_pct_expressed: 0.1
    use_patient_effects: true
    model_formula: "~ condition + sample_id + cngeneson"
  logfc_threshold: 0.25
  pval_threshold: 0.05
  min_cells_per_group: 10

pathway_enrichment:
  enabled: true
  run_directional: true
  pval_threshold: 0.05
  direction_threshold: 0.25
  min_genes: 5
  enrichr_cutoff: 0.05
  gene_sets:
    - "MSigDB_Hallmark_2020"
  run_gsea: false
  plot_top_n: 15
  plot_format: "png"
  plot_dpi: 300

visualization:
  generate_plots: true
  plot_format: "png"
  plot_dpi: 300

metadata:
  analysis_name: "B_cells Post-Treatment Response Analysis"
  description: "MAST analysis of B_cells - post-treatment comparison"
  model: "MAST hurdle model with patient effects"
  date_created: "2025-10-06"
